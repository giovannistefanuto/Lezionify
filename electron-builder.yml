appId: com.lezionify.app
productName: Lezionify
copyright: Copyright © 2026 Lezionify
publish:
  provider: github
  owner: giovannistefanuto
  repo: Lezionify
  releaseType: draft
releaseInfo:
  releaseNotesFile: docs/releases/0.8.0.md

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/youtube-tools
    to: youtube-tools
    filter:
      - "*.exe"
      - "*.json"
      - "*.md"
      - "*.txt"

asarUnpack:
  - "out/main/course-rag/**"
  - "node_modules/ffmpeg-static/**"
  - "out/main/translation-runtime/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/@img/**"
  - "node_modules/sharp/**"

win:
  signExts:
    - "!yt-dlp.exe"
    - "!deno.exe"
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  selectPerMachineByDefault: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lezionify

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
