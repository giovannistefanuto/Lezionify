appId: com.lezionify.app
productName: Lezionify
copyright: Copyright © 2026 Lezionify

directories:
  output: dist
  buildResources: resources

files:
  - out/**/*
  - package.json

asarUnpack:
  - "out/main/course-rag/**"
  - "node_modules/ffmpeg-static/**"
  - "out/main/translation-runtime/**"
  - "node_modules/onnxruntime-node/**"
  - "node_modules/@img/**"
  - "node_modules/sharp/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lezionify

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
