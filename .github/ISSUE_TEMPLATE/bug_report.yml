name: Bug report
description: Segnala un comportamento riproducibile di Lezionify
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Grazie per la segnalazione. Non allegare audio, trascrizioni o chiavi API reali.
  - type: textarea
    id: description
    attributes:
      label: Descrizione
      description: Cosa è successo e cosa ti aspettavi?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passaggi per riprodurre
      placeholder: "1. Apri…\n2. Seleziona…\n3. Osserva…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione o commit
      placeholder: v0.1.0 oppure hash del commit
  - type: input
    id: environment
    attributes:
      label: Ambiente
      placeholder: Windows 11, Node 22
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: Ho rimosso dati personali, trascrizioni reali e credenziali dagli allegati.
          required: true
