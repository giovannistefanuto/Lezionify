name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: npm ci
      - name: Prepare pinned YouTube tools
        run: npm run prepare:youtube-tools

      - name: Typecheck
        run: npm run typecheck

      - name: Test inventory and accidental suppression guard
        run: npm run test:inventory

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Offline public RAG retrieval gate (no model or API)
        run: node tools/evaluate_course_rag.mjs --gate

      - name: Gemini benchmark unit tests
        run: npm run test:benchmark

      - name: Q&A benchmark unit tests
        run: npm run test:qna-benchmark

      - name: React and Electron regression tests
        run: npm run test:hooks

      - name: App updater transport and consent regression tests
        run: npm run test:app-update

      - name: Release version and notes contract
        run: npm run release:validate

      - name: Production build
        run: npm run build

      - name: Collection restart and compiled application regression tests
        run: npm run test:collections

      - name: Test Sessione in Electron
        run: npm run test:sessione

      - name: PDF export regression tests
        run: npm run test:pdf-export
